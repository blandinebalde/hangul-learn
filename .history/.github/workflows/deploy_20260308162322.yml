name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect project directory
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "app_dir=." >> $GITHUB_OUTPUT
            echo "lock_path=package-lock.json" >> $GITHUB_OUTPUT
          elif [ -f app/package.json ]; then
            echo "app_dir=app" >> $GITHUB_OUTPUT
            echo "lock_path=app/package-lock.json" >> $GITHUB_OUTPUT
          else
            echo "No package.json found at root or in app/"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ steps.detect.outputs.lock_path }}

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ steps.detect.outputs.app_dir }}

      - name: Build
        run: npm run build
        working-directory: ${{ steps.detect.outputs.app_dir }}

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ steps.detect.outputs.app_dir }}/dist
          force_orphan: true
