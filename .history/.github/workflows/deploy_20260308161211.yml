name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect project directory
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "app_dir=." >> $GITHUB_OUTPUT
            echo "lock_path=package-lock.json" >> $GITHUB_OUTPUT
          elif [ -f app/package.json ]; then
            echo "app_dir=app" >> $GITHUB_OUTPUT
            echo "lock_path=app/package-lock.json" >> $GITHUB_OUTPUT
          else
            echo "No package.json found"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ steps.detect.outputs.lock_path }}

      - name: Install and build
        run: |
          npm ci
          npm run build
        working-directory: ${{ steps.detect.outputs.app_dir }}

      - name: Copy build into docs
        run: |
          ROOT="${{ steps.detect.outputs.app_dir }}"
          rm -rf docs
          mkdir -p docs
          cp -r "$ROOT/dist/"* docs/

      - name: Commit and push docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --staged --quiet || (git commit -m "Deploy to GitHub Pages" && git push)
