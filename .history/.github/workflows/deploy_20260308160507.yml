name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect project directory
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "app_dir=." >> $GITHUB_OUTPUT
            echo "lock_path=package-lock.json" >> $GITHUB_OUTPUT
          elif [ -f app/package.json ]; then
            echo "app_dir=app" >> $GITHUB_OUTPUT
            echo "lock_path=app/package-lock.json" >> $GITHUB_OUTPUT
          else
            echo "No package.json found at root or in app/"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ steps.detect.outputs.lock_path }}

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ steps.detect.outputs.app_dir }}

      - name: Build
        run: npm run build
        working-directory: ${{ steps.detect.outputs.app_dir }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.detect.outputs.app_dir }}/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
